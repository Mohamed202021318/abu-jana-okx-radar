<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abu Jana OKX Ultimate Radar - 120 ثانية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #00ffcc;
            font-size: 22px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .status {
            font-size: 18px;
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            background: #2d2d2d;
        }
        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #444;
            font-size: 14px;
        }
        th {
            background-color: #333;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Abu Jana OKX Ultimate Radar</h1>
        <p>راصد العقود الآجلة - تحديث تلقائي كل 120 ثانية</p>
        
        <div class="status" id="statusText">جاري الاتصال بالسوق وجلب البيانات...</div>

        <table>
            <thead>
                <tr>
                    <th>العملة</th>
                    <th>السعر الحالي</th>
                    <th>التغير (24 ساعة)</th>
                </tr>
            </thead>
            <tbody id="marketTable">
                <tr>
                    <td colspan="3">في انتظار البيانات...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchOKXData() {
            const statusText = document.getElementById("statusText");
            const marketTable = document.getElementById("marketTable");
            
            try {
                statusText.innerText = "جاري تحديث الرادار...";
                const response = await fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP');
                const data = await response.json();
                
                if(data && data.data) {
                    let rows = "";
                    // عرض عينة من العملات النشطة للتأكد من عمل الرادار
                    const topTickers = data.data.slice(0, 5); 
                    topTickers.forEach(ticker => {
                        let color = parseFloat(ticker.last) >= parseFloat(ticker.open24h) ? "#00ffcc" : "#ff4d4d";
                        rows += `<tr>
                            <td><b>${ticker.instId}</b></td>
                            <td>${ticker.last}</td>
                            <td style="color: ${color}">${(((ticker.last - ticker.open24h)/ticker.open24h)*100).toFixed(2)}%</td>
                        </tr>`;
                    });
                    marketTable.innerHTML = rows;
                    statusText.innerText = "الرادار يعمل بنجاح - يتم التحديث كل 120 ثانية";
                }
            } catch (error) {
                statusText.innerText = "خطأ في الاتصال بالمنصة، يتم إعادة المحاولة...";
            }
        }

        // تشغيل فوري عند فتح الصفحة
        fetchOKXData();

        // التحديث تلقائياً كل 120 ثانية (120000 مللي ثانية)
        setInterval(fetchOKXData, 120000);
    </script>

</body>
</html>
